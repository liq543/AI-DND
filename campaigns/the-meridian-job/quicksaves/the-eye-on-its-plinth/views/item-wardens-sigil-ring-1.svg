<text x="24" y="262" font-family="Georgia,serif" font-size="13.5" fill="#2b1d0e"><tspan x="24" dy="0">Varga&#x27;s Meridian Warden sigil: silver,</tspan><tspan x="24" dy="19">stamped with the sun-and-key. Tuned to the</tspan><tspan x="24" dy="19">museum&#x27;s ward lattice. Passes the Bridge of</tspan><tspan x="24" dy="19">Saints staff gate, the island&#x27;s outer wards</tspan><tspan x="24" dy="19">and the galleries after hours, but not the</tspan><tspan x="24" dy="19">Orrery floor. It becomes an alarm once the</tspan><tspan x="24" dy="19">Wardens strike Varga&#x27;s name from their</tspan><tspan x="24" dy="19">ledger.</tspan></text>
<text x="180" y="498" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#6a5438">Source: stolen: pried off Sergeant Varga&#x27;s chained hand in the Heron&#x27;s brig</text>
</svg>