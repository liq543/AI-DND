<text x="24" y="262" font-family="Georgia,serif" font-size="13.5" fill="#2b1d0e"><tspan x="24" dy="0">Lot 9. A masterwork skeleton key of blued</tspan><tspan x="24" dy="19">steel, its bow shaped like a bird in flight:</tspan><tspan x="24" dy="19">the Magpie&#x27;s own. Catalogued as &#x27;removed</tspan><tspan x="24" dy="19">from exhibit The Thief during routine</tspan><tspan x="24" dy="19">cleaning.&#x27;</tspan></text>
