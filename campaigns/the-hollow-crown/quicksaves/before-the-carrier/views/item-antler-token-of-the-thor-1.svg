<text x="24" y="262" font-family="Georgia,serif" font-size="13.5" fill="#2b1d0e"><tspan x="24" dy="0">A disc of polished antler the size of a</tspan><tspan x="24" dy="19">palm, carved with a stag&#x27;s head crowned by</tspan><tspan x="24" dy="19">an oak over an open hand, strung on red</tspan><tspan x="24" dy="19">cord. Old, worn smooth by many thumbs. Found</tspan><tspan x="24" dy="19">in Sedge&#x27;s furs.</tspan><tspan x="24" dy="19"></tspan><tspan x="24" dy="19">trinket</tspan></text>
