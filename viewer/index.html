<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Table</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="brand"><span class="d20">⬢</span> <span id="title">Live Table</span></div>
  <div id="meta"></div>
  <div class="spacer"></div>
  <div id="integrity" title="Every change is a signed, hash-chained event. Tampering is detected."></div>
  <div id="conn" class="dot" title="live connection"></div>
</header>
<div id="alert" hidden></div>
<main>
  <section id="stage">
    <div id="scene" hidden></div>
    <div id="initbar" hidden></div>
    <nav id="maptabs"></nav>
    <div id="viewport">
      <div id="mapwrap"><div id="map"></div></div>
      <div id="nomap">Waiting for the Dungeon Master to reveal a map…</div>
      <div class="mapctl">
        <button data-z="in" title="Zoom in">＋</button><button data-z="out" title="Zoom out">－</button><button data-z="fit" title="Fit">⤢</button>
      </div>
    </div>
  </section>
  <div id="sidegrip" title="Drag to resize · double-click to reset"></div>
  <aside id="side">
    <nav id="tabs">
      <button data-tab="party" class="on">Party</button>
      <button data-tab="turns">Turns</button>
      <button data-tab="dice">Dice</button>
      <button data-tab="log">Log</button>
      <button data-tab="sheet">Sheet</button>
      <button data-tab="journal">Journal</button>
    </nav>
    <div id="panel-party" class="panel on"></div>
    <div id="panel-turns" class="panel"></div>
    <div id="panel-dice" class="panel"></div>
    <div id="panel-log" class="panel"></div>
    <div id="panel-sheet" class="panel"></div>
    <div id="panel-journal" class="panel"></div>
  </aside>
</main>
<div id="requests"></div>
<div id="diceov" hidden><div class="die"><svg viewBox="0 0 100 100"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28" /><polygon class="inner" points="50,22 76,66 24,66"/></svg><span id="dieval"></span></div><div id="dielabel"></div></div>
<div id="modal" hidden><div class="card"><button class="x" title="Close">✕</button><div id="modalbody"></div></div></div>
<div id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
