<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Table</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header id="top">
  <div class="brand"><svg class="d20" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28"/><polygon class="in" points="50,22 76,66 24,66"/></svg><span id="title">Live Table</span></div>
  <div id="meta"></div>
  <div class="spacer"></div>
  <div class="hbtns">
    <button id="fxbtn" class="hbtn" title="Table animation" aria-haspopup="true" aria-expanded="false"><span class="ic">🎞</span><span id="fxlabel">Animations</span></button>
    <div id="fxmenu" class="menu" hidden>
      <div class="mhead">Table animation</div>
      <div id="fxdm" class="muted small"></div>
      <label class="opt"><input type="radio" name="fxpref" value="dm"> <span><b>As the DM set it</b><small>Moves, attacks, turn banners and weather play as the DM chose.</small></span></label>
      <label class="opt"><input type="radio" name="fxpref" value="reduced"> <span><b>Reduced motion</b><small>Faster, no screen shake or weather.</small></span></label>
      <label class="opt"><input type="radio" name="fxpref" value="off"> <span><b>Off</b><small>Changes appear instantly.</small></span></label>
    </div>
  </div>
  <div id="integrity" title="Every change is a signed, hash-chained event. Tampering is detected."></div>
  <div id="conn" class="dot" title="Live connection"></div>
</header>
<div id="alert" hidden></div>
<main>
  <section id="stage">
    <div id="scene" hidden></div>
    <div id="initbar" hidden></div>
    <nav id="maptabs"></nav>
    <div id="viewport">
      <div id="mapwrap"><div id="map"></div></div>
      <canvas id="ambient"></canvas>
      <div id="fxscreen"></div>
      <div id="nomap"><div class="nm"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28"/><polygon class="in" points="50,22 76,66 24,66"/></svg>
        <p>Waiting for the Dungeon Master to reveal a map…</p></div></div>
      <button id="skipfx" title="Skip the animation">Skip ⏭</button>
      <div class="mapctl">
        <button data-z="follow" id="followbtn" title="Follow the action (camera)">◎</button>
        <button data-z="in" title="Zoom in">＋</button><button data-z="out" title="Zoom out">－</button><button data-z="fit" title="Fit">⤢</button>
      </div>
    </div>
  </section>
  <div id="sidegrip" title="Drag to resize · double-click to reset"></div>
  <aside id="side">
    <nav id="tabs">
      <button data-tab="party" class="on">Party</button>
      <button data-tab="turns">Turns</button>
      <button data-tab="dice">Dice</button>
      <button data-tab="log">Log</button>
      <button data-tab="sheet">Sheet</button>
      <button data-tab="journal">Journal</button>
    </nav>
    <div id="panel-party" class="panel on"></div>
    <div id="panel-turns" class="panel"></div>
    <div id="panel-dice" class="panel"></div>
    <div id="panel-log" class="panel"></div>
    <div id="panel-sheet" class="panel"></div>
    <div id="panel-journal" class="panel"></div>
  </aside>
</main>
<div id="requests"></div>
<div id="modal" hidden><div class="card"><button class="x" title="Close (Esc)">✕</button><div id="modalbody"></div></div></div>
<div id="toasts"></div>
<script src="/fx.js"></script>
<script src="/app.js"></script>
</body>
</html>
